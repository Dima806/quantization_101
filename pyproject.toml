[project]
name = "quantization-101"
version = "0.1.0"
description = "Quantization 101: you can throw away three quarters of every number and barely notice"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "numpy>=1.26",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.18",  # optional reference int8 path
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

# This repo is run from its root (`from src.quant... import ...`); it is not an
# installable package, so uv should not try to build it on sync.
[tool.uv]
package = false

# Force the CPU-only torch build: the default Linux wheel pulls ~3 GB of CUDA
# libraries we never use (no GPU) and would not fit the Codespace disk.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
